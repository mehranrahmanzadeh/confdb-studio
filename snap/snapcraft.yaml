name: confdb-studio
title: Confdb Studio
version: "0.1.0"
summary: GUI for creating, editing and signing confdb schemas
description: |
  A graphical user interface to create, edit and sign confdb schema assertions.
license: GPL-2.0-only
contact: https://github.com/mehranrahmanzadeh/confdb-studio/issues
issues: https://github.com/mehranrahmanzadeh/confdb-studio/issues
source-code: https://github.com/mehranrahmanzadeh/confdb-studio
website: https://github.com/mehranrahmanzadeh/confdb-studio

base: core24
confinement: classic
grade: stable

platforms:
  amd64:
  arm64:

lint:
  ignore:
    - classic:
      - confdb_studio
      - lib/libfile_selector_linux_plugin.so
      - lib/libflutter_linux_gtk.so
      - lib/libsnapstore_auth.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libffi.so.8.1.4
    - library:
      - confdb_studio
      - lib/libfile_selector_linux_plugin.so
      - lib/libflutter_linux_gtk.so
      - lib/libsnapstore_auth.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libcolordprivate.so.2.0.5
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdconf.so.1.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicuio.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicutest.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicutu.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicui18n.so.74.2

apps:
  confdb-studio:
    command: confdb_studio
    environment:
      CONFDB_BACKEND: rest

parts:
  confdb-studio:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - pkg-config
      - libgtk-3-dev
    override-pull: |
      craftctl default
      # `linux/rust/` is a local, gitignored staging dir
      # (scripts/build_rust_backend.sh) that a dev's working tree may
      # already have populated. Strip it so this part never bundles its own
      # copy of `libsnapstore_auth.so` via linux/CMakeLists.txt's
      # conditional install — the `rust-auth` part is the only source of
      # that file, or staging fails with a same-file-different-contents
      # conflict between the two parts.
      rm -rf linux/rust

  rust-auth:
    plugin: nil
    # Not vendored in this repo: built straight from the same pinned
    # `snapstore_auth` git dependency `pubspec.yaml` declares (keep the
    # tag/ref in sync with that file).
    source: https://github.com/ogra1/snapstore-auth.git
    source-type: git
    source-tag: v0.2.0
    build-packages:
      - curl
      - gcc
      - pkg-config
    override-build: |
      set -eux
      # core24's archive `cargo`/`rustc` (~1.75) can't read this crate's
      # Cargo.lock (format v4, needs Rust 1.78+): use rustup for a current
      # stable toolchain instead of relying on the apt package.
      if ! command -v cargo >/dev/null 2>&1; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
      fi
      . "$HOME/.cargo/env"
      cargo build --release --manifest-path "$CRAFT_PART_SRC/Cargo.toml" --target-dir "$CRAFT_PART_BUILD/target"
      install -D "$CRAFT_PART_BUILD/target/release/libsnapstore_auth.so" "$CRAFT_PART_INSTALL/lib/libsnapstore_auth.so"
