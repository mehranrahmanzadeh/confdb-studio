name: confdb-studio
version: "0.0.1"
summary: GUI for creating, editing and signing confdb schemas
description: |
  A graphical user interface to create, edit and sign confdb schema assertions.
license: GPL-2.0-only

base: core24
confinement: classic
grade: stable

platforms:
  amd64:
  arm64:

lint:
  ignore:
    - classic:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/dri/libdril_dri.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libffi.so.8.1.4
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgallium-25.2.8-0ubuntu0.24.04.2.so
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libwayland-client.so.0.22.0
    - library:
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libEGL.so.1.1.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libEGL_mesa.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGL.so.1.7.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLESv2.so.2.1.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLX_mesa.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libcolordprivate.so.2.0.5
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libdconf.so.1.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgirepository-1.0.so.1.0.
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libglapi.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgthread-2.0.so.0.8000.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libibus-1.0.so.5.0.529
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicuio.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicutest.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpcre2-16.so.0.11.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpcre2-32.so.0.11.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libpcre2-posix.so.3.0.4
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libvulkan.so.1.3.275
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLX.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libXxf86vm.so.1.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicutu.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libxcb-glx.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libGLdispatch.so.0.0.0
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libicui18n.so.74.2
      - usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgirepository-1.0.so.1.0.0

apps:
  confdb-studio:
    command: confdb_studio
    environment:
      CONFDB_BACKEND: rest

parts:
  confdb-studio:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    build-packages:
      - pkg-config
      - libgtk-3-dev