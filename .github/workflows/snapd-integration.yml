name: snapd integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapd-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the VM image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Set up LXD
        run: |
          test -c /dev/kvm
          if ! snap list lxd; then
            sudo snap install lxd
          fi
          sudo lxd waitready
          # A dir pool keeps the VM image sparse; sized pools can be too small.
          sudo lxd init --auto --storage-backend dir || sudo lxd init --auto
          sudo lxc storage list
      - name: Build snapd with test keys and test in a fresh VM
        run: |
          sudo env SNAPD_IT_OUTPUT="$RUNNER_TEMP/snapd-integration" \
            bash scripts/test_snapd_integration.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapd-integration
          path: ${{ runner.temp }}/snapd-integration
          if-no-files-found: warn
          retention-days: 7
