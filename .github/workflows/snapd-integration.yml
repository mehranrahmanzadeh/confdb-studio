name: snapd integration

# Writable tests against a real snapd. They acknowledge assertions, install
# snaps and write confdb values, so they only ever run on a GitHub-hosted
# runner (thrown away after the job) — never on a self-hosted one.
#
# Run both suites on pull requests, main pushes and nightly using stock snapd.
# PR jobs consume only public signed assertions, never a private signing key.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      custodian:
        description: Run the custodian suite with the public signed fixture
        type: boolean
        default: true
  schedule:
    - cron: '20 3 * * *'

permissions:
  contents: read

concurrency:
  group: snapd-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  builtin:
    name: Stock snapd
    # Must be a GitHub-hosted runner: the suite refuses to mutate anything else.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Provision
        run: |
          sudo env "GITHUB_ACTIONS=$GITHUB_ACTIONS" "CI=$CI" \
            "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            scripts/integration/provision.sh --kind github

      - name: Test
        # snapd only lets an administrator read or write confdb values, and
        # there's no one to answer a polkit prompt here, so the suite runs as
        # root. `-E` plus an explicit PATH keeps the Flutter the action set up.
        run: |
          sudo -E env "PATH=$PATH" flutter test test/integration/snapd_builtin_test.dart \
            --dart-define=SNAPD_IT=true

      - name: Diagnostics
        if: failure()
        run: scripts/integration/diagnostics.sh

  custodian:
    name: Custodian (stock snapd)
    if: github.event_name != 'workflow_dispatch' || inputs.custodian
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Provision with custodian
        run: |
          sudo env "GITHUB_ACTIONS=$GITHUB_ACTIONS" "CI=$CI" \
            "RUNNER_ENVIRONMENT=$RUNNER_ENVIRONMENT" \
            scripts/integration/provision.sh --kind github --custodian

      - name: Test
        run: |
          sudo -E env "PATH=$PATH" flutter test test/integration \
            --dart-define=SNAPD_IT=true --dart-define=SNAPD_IT_CUSTODIAN=true

      - name: Diagnostics
        if: failure()
        run: scripts/integration/diagnostics.sh

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapd-diagnostics
          path: ${{ runner.temp }}/snapd-diagnostics
          retention-days: 7
